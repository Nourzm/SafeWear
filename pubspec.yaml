name: safewear
description: "SafeWear — AI-Powered Personal Safety System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Firebase
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  firebase_storage: ^13.4.0
  firebase_messaging: ^16.2.1
  cloud_functions: ^6.3.0

  # Location & Maps
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.1
  geofence_service: ^6.0.0

  # Background services
  flutter_background_service: ^5.1.0

  # Bluetooth / Watch
  flutter_blue_plus: ^2.3.2

  # Audio
  record: ^6.2.0
  just_audio: ^0.10.5

  # SMS & Connectivity
  connectivity_plus: ^6.1.4

  # Local storage
  shared_preferences: ^2.5.3

  # File paths
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^11.4.0

  # Sensors (for phone-based detection)
  sensors_plus: ^6.1.1

  # UI utilities
  flutter_svg: ^2.1.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
