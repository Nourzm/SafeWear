name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version used for local development so analyze and
          # build behave identically.
          flutter-version: "3.38.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/safewear-release.jks"

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SAFEWEAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export SAFEWEAR_KEYSTORE_PATH="$RUNNER_TEMP/safewear-release.jks"
            echo "Signing with release keystore"
          else
            echo "WARNING: KEYSTORE_BASE64 secret not set — signing with debug keys"
          fi
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log

      - name: Post failure log as commit comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) {}
            const tail = log.split('\n').slice(-100).join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### CI build failure — log tail\n```\n' + tail + '\n```',
            });

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeWear-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
